<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./titlesection/titlesection.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Armata&display=swap">
  </head>
  <body>  
    <div class="main-section" id="title">
      <h1 class="title-section-header">Damife Odunukan</h1>
      <p class="title-section-subtitle">Empowering Individuals Through Education</p>
      <button class="title-section-button" onclick="makeDreamComeTrue()">Combine knowledge with action</button>

  <style>
    /* * Asterisk target's all elements */
    *{ 
      box-sizing: border-box; 
      font-family: 'Armata';
    }

    <!--Below is CSS RESET, VERY IMPORTANT-->
    html, body {
      margin: 0px;
      padding: 0px;
    }

    .main-section{
      width: 100vw;
      height: 100vh;
      background-size: cover;
      padding: 25px;
    }
  </style>

  <script>
    function makeDreamComeTrue() {
      document.body.style.background =
        "url(https://i.pinimg.com/originals/96/b5/1d/96b51d3bb8104d88b94951a74d4009dd.gif)";
      document.getElementById("title").style.visibility = "hidden";
    }
  </script>
