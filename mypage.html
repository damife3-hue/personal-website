<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./titlesection/titlesection.css">
  </head>
  <body>  
    <div class="main-section" id="title">
      <h1>Welcome to Dami's webpage</h1>
      <p>this is where dream's come true</p>
      <button onclick="makeDreamComeTrue()">Make dream come true</button>
    </div>  
    
  </body>

  
  <style>

    <!--* targets all elements-->
    
    *{ 
      box-sizing: border-box; 
    }

    <!--Below is CSS RESET, VERY IMPORTANT-->
    html, body {
      margin: 0px;
      padding: 0px;
    }

    .main-section{
      width: 100vw;
      height: 100vh;
      background-size: cover;
    }
  </style>

  <script>
    function makeDreamComeTrue() {
      document.body.style.background =
        "url(https://i.pinimg.com/originals/96/b5/1d/96b51d3bb8104d88b94951a74d4009dd.gif)";
      document.getElementById("title").style.visibility = "hidden";
    }
  </script>
</html>
